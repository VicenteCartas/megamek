import java.time.LocalDateTime

plugins {
    id 'application'
    id 'com.palantir.git-version' version '5.0.0'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id "io.sentry.jvm.gradle" version '6.4.0'
    id 'jacoco'
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.1'
}

apply from: file("${rootDir}/gradle/suite_archive_adapter.gradle")

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = true
    reproducibleFileOrder = true
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['resources']
        }
    }
    test {
        java {
            srcDirs = ['unittests']
        }
        resources {
            srcDirs = ['testresources']
        }
    }
}

// Filter only the packaged properties file; leave the source and other presentation keys untouched.
// processResources is also used by run and test, so Version() sees the same identity as the archive.
def suiteReleaseVersion = rootProject.findProperty('suiteReleaseVersion')
def suiteProductVersion = rootProject.findProperty('suiteMegaMekVersion') ?: suiteReleaseVersion
def suitePins = [megamekCommit: ['suiteMegaMekCommit', rootDir],
                 megameklabCommit: ['suiteMegaMekLabCommit', new File(rootDir, '../megameklab')],
                 mekhqCommit: ['suiteMekHQCommit', new File(rootDir, '../mekhq')],
                 mmDataCommit: ['suiteMmDataCommit', new File(rootDir, '../mm-data')]]
def suiteIdentity = {
    if (suiteReleaseVersion == null) {
        throw new GradleException('Supply -PsuiteReleaseVersion for a suite product package')
    }
    if (project.version.toString() != suiteProductVersion.toString()) {
        throw new GradleException('Suite product archive version must equal suiteMegaMekVersion (omit extraVersion)')
    }
    def values = [schemaVersion: '1', product: 'MegaMek', version: suiteProductVersion.toString()]
    suitePins.each { key, pin ->
        def value = rootProject.findProperty(pin[0])?.toString()
        if (!(value ==~ /[0-9a-f]{40}/)) {
            throw new GradleException("${pin[0]} must be a lowercase 40-character SHA-1 commit")
        }
        values[key] = value
    }
    values.minimumJavaVersion = '21'
    values
}
def gitOutput = { File directory, String... arguments ->
    def command = ['git', '-C', directory.canonicalPath] + arguments.toList()
    try {
        def execution = providers.exec {
            commandLine command
            ignoreExitValue = true
        }
        if (execution.result.get().exitValue != 0) {
            throw new GradleException("${command.join(' ')} failed: ${execution.standardError.asText.get()}")
        }
        return execution.standardOutput.asText.get().trim()
    } catch (IOException e) {
        throw new GradleException("Cannot inspect Git checkout ${directory}", e)
    }
}
        // Inspect the source trees consumed by jar, staging and the distribution, not build outputs.
        // The local data/ mirror is ignored by Git; only byte-identical, tracked mm-data files
        // may appear there. This catches ignored packageable files (git status alone does not).
        def checkSuiteSources = { File directory ->
            def scopes = directory.canonicalFile == new File(rootDir, '../mm-data').canonicalFile
                    ? ['data', 'src']
                    : directory.canonicalFile == rootDir.canonicalFile
                            ? ['megamek/src', 'megamek/resources', 'megamek/data', 'megamek/docs',
                               'megamek/mmconf', 'megamek/scripts', 'megamek/userdata',
                               ':(top,glob)megamek/*.ini', 'megamek/SubmitBug.html',
                               'megamek/sentry.properties']
                            : directory.name == 'megameklab'
                                    ? ['megameklab/src', 'megameklab/resources', 'megameklab/data',
                                       'megameklab/docs', 'megameklab/mmconf', 'megameklab/scripts',
                                       ':(top,glob)megameklab/*.ini', 'megameklab/SubmitBug.html',
                                       'megameklab/sentry.properties']
                                    : ['MekHQ/src', 'MekHQ/resources', 'MekHQ/data', 'MekHQ/docs',
                                       'MekHQ/mmconf', 'MekHQ/scripts', 'MekHQ/campaigns', 'MekHQ/userdata',
                                       ':(top,glob)MekHQ/*.ini', 'MekHQ/SubmitBug.html',
                                       'MekHQ/sentry.properties']
            def dataRepo = new File(rootDir, '../mm-data')
            def trackedData = gitOutput(dataRepo, 'ls-files', '-z', '--cached', '--', 'data')
                    .split('\u0000').toList().toSet()
            def untracked = gitOutput(directory, (['ls-files', '-z', '--others', '--exclude-standard', '--'] + scopes)
                    as String[]).split('\u0000')
            def ignored = gitOutput(directory, (['ls-files', '-z', '--others', '--ignored',
                    '--exclude-standard', '--'] + scopes) as String[]).split('\u0000')
            def unknown = (untracked.toList() + ignored.toList()).unique()
            unknown.each { path ->
                if (!path) {
                    return
                }
                def relative = path.replaceFirst(/^(?:megamek|megameklab|MekHQ)\//, '')
                if (relative.startsWith('userdata/')
                        || relative ==~ /mmconf\/(?:clientsettings\.xml|gameoptions\.xml|(?:mm|mml|mhq)\.preferences|megameklab\.properties(?:\.bak)?|recent-advanced-searches\.json|recent_boards\.yml|searches\/[^\/]+\.json)/
                        || relative in ['docs/OfficialUnitList.txt', 'docs/mm-revision.txt',
                                        'docs/mml-revision.txt', 'docs/mhq-revision.txt',
                                        'MegaMek.l4j.ini', 'MegaMekLab.l4j.ini', 'MekHQ.l4j.ini',
                                        'data/mekfiles/unit_files.zip', 'data/rat/rat_default.zip',
                                        'data/mekfiles/units.cache',
                                        'data/universe/planetary_systems/canon_systems.zip',
                                        'data/universe/planetary_systems/connector_systems.zip']) {
                    // Excluded user files, or known derived outputs overwritten by producer tasks.
                    return
                }
                def mirror = path =~ /^(?:megamek\/|megameklab\/|MekHQ\/)data\/(.+)$/
                def source = mirror.matches() ? "data/${mirror.group(1)}".toString() : null
                if (source?.startsWith('data/images/force/Units/') && !trackedData.contains(source)) {
                    source = source.replace('data/images/force/Units/', 'data/images/universe/factions/')
                }
                File local = new File(directory, path)
                File canonical = source == null ? null : new File(dataRepo, source)
                if (source == null || !trackedData.contains(source) || !canonical.isFile()
                        || (!java.util.Arrays.equals(local.bytes, canonical.bytes)
                            && !suiteMirrorMatchesPin(local, source))) {
                    throw new GradleException("Unpinned package input in ${directory}: ${path}")
                }
            }
        }
// Run before any staging task can modify the workspace, not merely before distTar itself.
gradle.taskGraph.whenReady { graph ->
    if (suiteReleaseVersion != null && graph.hasTask(tasks.named('distTar').get())) {
        def identity = suiteIdentity()
        suitePins.each { key, pin ->
            File directory = pin[1]
            if (!directory.isDirectory() || gitOutput(directory, 'rev-parse', '--show-toplevel')
                    .replace('\\', '/').toLowerCase(Locale.ROOT) !=
                    directory.canonicalPath.replace('\\', '/').toLowerCase(Locale.ROOT)) {
                throw new GradleException("${pin[0]} must refer to its own sibling Git checkout: ${directory}")
            }
            if (gitOutput(directory, 'rev-parse', 'HEAD') != identity[key]) {
                throw new GradleException("${pin[0]} does not match HEAD of ${directory}")
            }
            if (gitOutput(directory, 'status', '--porcelain=v1', '--untracked-files=no')) {
                throw new GradleException("Tracked changes in ${directory}; suite packages require clean checkouts")
            }
            checkSuiteSources(directory)
        }
    }
}
if (suiteReleaseVersion != null) {
    def components = suiteProductVersion.toString().split(/\./)
    tasks.named('processResources') {
        inputs.property('suiteMegaMekVersion', suiteProductVersion.toString())
        filesMatching('Version.properties') {
            filter { line ->
                if (line ==~ /(?:major|minor|patch)=.*/) {
                    def key = line.substring(0, line.indexOf('='))
                    def value = "${key}=${components[['major': 0, 'minor': 1, 'patch': 2][key]]}"
                    // A Weekly carries its fourth component (0.51.00.2); other suite releases have none.
                    return key == 'patch' && components.length > 3 ? "${value}\nrevision=${components[3]}" : value
                }
                return line ==~ /\s*revision=.*/ ? '# revision replaced by suiteReleaseVersion' : line
            }
        }
    }
}

tasks.register('verifySuiteVersion') {
    description = 'Checks that the packaged Version.properties agrees with the Gradle suite version.'
    group = 'verification'
    dependsOn tasks.named('processResources')
    doLast {
        def packaged = new Properties()
        layout.buildDirectory.file('resources/main/Version.properties').get().asFile.withInputStream {
            packaged.load(it)
        }
        def actual = String.format('%d.%02d.%02d', Integer.parseInt(packaged.getProperty('major')),
                Integer.parseInt(packaged.getProperty('minor')), Integer.parseInt(packaged.getProperty('patch')))
        if (packaged.getProperty('revision')?.trim()) {
            def revision = Integer.parseInt(packaged.getProperty('revision').trim())
            if (revision > 0) {
                actual += ".${revision}"
            }
        }
        def expected = project.version.toString().split('-', 2)[0]
        if (actual != expected) {
            throw new GradleException("Packaged version ${actual} does not match project version ${expected}")
        }
    }
}

tasks.register('validateSuiteRecord', JavaExec) {
    description = 'Validates a complete suite record: -PsuiteRecordFile=path/to/record.json'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'megamek.release.SuiteRecordValidator'
    doFirst {
        if (!project.hasProperty('suiteRecordFile')) {
            throw new GradleException('Supply -PsuiteRecordFile=path/to/record.json')
        }
        args = [project.file(project.property('suiteRecordFile')).absolutePath]
    }
}

dependencies {
    // The optional GPU battle window shares the Java game model with the Swing client.
    def gdxVersion = '1.14.2'
    implementation "com.badlogicgames.gdx:gdx:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-freetype:${gdxVersion}"
    // JAWT gives the native windows of Swing dialogs that the 3D window owns on macOS and Linux. Pure Java (its
    // natives are in LWJGL's core), it must match the LWJGL version libGDX brings.
    implementation 'org.lwjgl:lwjgl-jawt:3.3.3'
    // Native File Dialog: the start screen's file pickers are the system's own on Windows, as the 3D window has no
    // Swing look to match. Same LWJGL version; elsewhere, and where its natives can't load, Swing's chooser stands in.
    implementation 'org.lwjgl:lwjgl-nfd:3.3.3'
    ['natives-windows', 'natives-windows-x86', 'natives-windows-arm64'].each { natives ->
        runtimeOnly "org.lwjgl:lwjgl-nfd:3.3.3:${natives}"
    }
    // CPU-only glTF decoding; terrain workers and unit validation share the same mesh data.
    implementation 'de.javagl:jgltf-model:2.0.4'
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:${gdxVersion}:natives-desktop"

    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.7'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.21.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.2'

    implementation 'com.formdev:flatlaf:3.7.1'
    implementation 'com.formdev:flatlaf-extras:3.7.1'
    // The board's shader editor reuses a full text editor (undo, folding, search and syntax highlighting).
    implementation 'com.fifesoft:rsyntaxtextarea:3.6.0'

    implementation 'com.sun.mail:jakarta.mail:2.0.2'

    implementation 'com.thoughtworks.xstream:xstream:1.4.21'

    implementation 'commons-io:commons-io:2.21.0'

    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.5'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    implementation 'org.apache.commons:commons-text:1.15.0'

    implementation 'org.apache.logging.log4j:log4j-api:2.25.5'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.5'

    implementation 'org.apache.pdfbox:pdfbox:3.0.7'

    implementation('org.apache.xmlgraphics:batik-bridge:1.19') {
        // We don't need the python and javascript engine taking up space
        exclude group: 'org.python', module: 'jython'
        exclude group: 'org.mozilla', module: 'rhino'
        // Exclude only the base xml-apis artifact (it duplicates JDK org.w3c.dom classes); keep xml-apis-ext,
        // which provides org.w3c.dom.svg used by Batik's SVG DOM at runtime.
        exclude group: 'xml-apis', module: 'xml-apis'
    }

    implementation 'org.freemarker:freemarker:2.3.35'

    implementation 'org.commonmark:commonmark:0.28.0'

    implementation 'com.squareup:gifencoder:0.10.1'

    implementation 'com.ibm.icu:icu4j:78.3'

    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime:4.0.7'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
    testRuntimeOnly('org.apache.xmlgraphics:batik-codec:1.19') {
        exclude group: 'xml-apis', module: 'xml-apis'
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.apache.xmlgraphics:batik-svggen:1.19'
}

ext {
    // XStream save games reflect over java.util and java.util.concurrent collections; the unit tests open them too.
    mmAddOpens = [
            '--add-opens',
            'java.base/java.util=ALL-UNNAMED',
            '--add-opens',
            'java.base/java.util.concurrent=ALL-UNNAMED'
    ]
    // The one set of JVM options for every MegaMek launch: run, the start scripts (MegaMek.sh), the Windows launcher
    // (MegaMek.l4j.ini) and the tasks that run the game's code like it.
    mmJvmOptions = [
            '-Xmx4096m',
            // Generational ZGC pauses for under a millisecond; G1's 5-20 ms pauses hitched the 3D board while it panned.
            '-XX:+UseZGC',
            '-XX:+ZGenerational'
    ] + mmAddOpens + [
            '-Dsun.awt.disablegrab=true'
    ]
    fileStagingDir = "${layout.buildDirectory.get()}/files"
    atlasedImages = "${fileStagingDir}/atlasedImages.txt"
}

application {
    mainClass = 'megamek.MegaMek'
    applicationDefaultJvmArgs = mmJvmOptions
}

jar {
    archiveFileName = 'MegaMek.jar'

    manifest {
        attributes "Main-Class": application.mainClass
        attributes "Class-Path": project.sourceSets.main.runtimeClasspath.files
                .findAll { it.name.endsWith(".jar") }.collect { "lib/${it.name}" }.join(' ')
        attributes "Add-Opens": 'java.base/java.util java.base/java.util.concurrent'
        // Tells the MegaMek Launcher to wait for the first window (see LauncherReadySignal)
        attributes "MegaMek-Launcher-Ready": '1'
        attributes "Build-Date": LocalDateTime.now()
        attributes "Sealed": true
    }
}

checkstyle {
    toolVersion = '13.4.0'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
    configProperties = [
            'suppressionFile': file("${rootDir}/config/checkstyle/checkstyle-suppressions.xml")
    ]
    maxWarnings = 0  // Fail on any warning
    maxErrors = 0    // Fail on any error
}

tasks.withType(Checkstyle).configureEach {
    minHeapSize = "1g"
    maxHeapSize = "4g"
}

// Source hygiene checks that do not depend on which editor wrote the code: import order, unused imports, trailing
// whitespace, final newline. `./gradlew spotlessCheck` reports every violation in one run; `./gradlew spotlessApply`
// fixes them all. The Checkstyle workflow runs the check as its first step on every PR.
//
// Deliberately no full formatter engine yet. The Java style in .editorconfig uses a 6-space continuation indent and
// IntelliJ's wrapping rules, which the Eclipse engine Spotless bundles cannot reproduce; enabling it would reformat
// most of the tree and then fight IntelliJ on every wrapped line. Choosing an engine is a separate decision.
spotless {
    // Checked explicitly by CI rather than as part of `build`, so a plain build stays fast and works in a shallow
    // checkout that has no origin/main to ratchet against.
    enforceCheck = false

    // Until the whole tree has been formatted once, only look at files that differ from origin/main (or
    // -PspotlessRatchetFrom=<ref>, which CI sets to the PR's target branch). Pass
    // -PspotlessFullTree to format everything (used for the one-time reformat and to measure it).
    if (!project.hasProperty('spotlessFullTree')) {
        ratchetFrom project.findProperty('spotlessRatchetFrom') ?: 'origin/main'
    }

    java {
        target 'src/**/*.java', 'unittests/**/*.java'

        // Matches ij_java_imports_layout in .editorconfig: static imports, then java/javax, then everything else.
        importOrder('\\#', 'java|javax', '')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()

        // Same fence the code already uses (see MDAugmentationType) and that .editorconfig configures for IntelliJ.
        toggleOffOn('@formatter:off', '@formatter:on')
    }
}

// Data is staged directly out of mm-data/data (no intermediate staging copy) and split
// into several Sync tasks by how often the content changes. The large, rarely-edited
// binary trees (images, boards, fonts) each own a disjoint subtree of data/, so editing
// loose data (units, scenarios) only re-copies the small text payload and leaves the
// image/board assets untouched (UP-TO-DATE). stageDataFiles aggregates them.
// Derived from rootDir (the megamek build root) rather than a build-file-relative path,
// so it survives project-layout changes. mm-data is a sibling of this build root
// (settings.gradle includes it as ../mm-data).
def mmDataDir = suiteDataFromPin ? suiteDataRoot.absolutePath : "${rootDir}/../mm-data"
def mmGeneratedDir = suiteGeneratedRoot.absolutePath
def mmDataOut = "${layout.projectDirectory.asFile}/data"

// Never stage macOS/Windows directory-metadata junk, regardless of what a developer's
// file browser may have dropped into the source tree.
tasks.withType(Sync).configureEach {
    exclude "**/.DS_Store"
    exclude "**/Thumbs.db"
}

tasks.register('stageDataImages', Sync) {
    description = "Syncs image data from mm-data"
    group = 'build'
    from("${mmDataDir}/data/images") {
        suiteDataRules.MegaMek.images.each { category -> include "${category}/**/*.*" }
    }
    into "${mmDataOut}/images"
}

tasks.register('stageDataBoards', Sync) {
    description = "Syncs board data from mm-data"
    group = 'build'
    from "${mmDataDir}/data/boards"
    into "${mmDataOut}/boards"
}

tasks.register('stageDataFonts', Sync) {
    description = "Syncs font data from mm-data"
    group = 'build'
    from "${mmDataDir}/data/fonts"
    into "${mmDataOut}/fonts"
}

tasks.register('stageDataMekfiles', Sync) {
    if (!suiteDataFromPin) {
        dependsOn gradle.includedBuild('mm-data').task(':unitFilesZip')
    }
    description = "Syncs unit files (loose text plus the zipped unit archive) from mm-data"
    group = 'build'
    from("${mmDataDir}/data/mekfiles") {
        include "*.txt"
        include "*.xml"
        include "*.csv"
    }
    from("${mmGeneratedDir}/mekfiles") {
        if (suiteDataFromPin) { include "unit_files.zip" }
    }
    into "${mmDataOut}/mekfiles"
}

tasks.register('stageDataRat', Sync) {
    if (!suiteDataFromPin) {
        dependsOn gradle.includedBuild('mm-data').task(':ratZip')
    }
    description = "Syncs the random assignment table archive from mm-data"
    group = 'build'
    from("${mmGeneratedDir}/rat") {
        if (suiteDataFromPin) { include "rat_default.zip" }
    }
    into "${mmDataOut}/rat"
}

tasks.register('stageData', Sync) {
    description = "Syncs all remaining loose data from mm-data"
    group = 'build'
    from("${mmDataDir}/data") {
        include "models/**/*.*"
        include "board-editor/**/*.*"
        suiteDataRules.MegaMek.loose.each { pattern -> include pattern }
    }
    into mmDataOut
    // The big asset trees are owned by the dedicated tasks above; don't delete them.
    preserve {
        include "images/**"
        include "boards/**"
        include "fonts/**"
        include "mekfiles/**"
        include "rat/**"
    }
}

tasks.register('stageDataFiles') {
    description = "Aggregates the split Sync tasks that stage MegaMek's data/ directory from mm-data."
    group = 'build'
    dependsOn stageDataImages
    dependsOn stageDataBoards
    dependsOn stageDataFonts
    dependsOn stageDataMekfiles
    dependsOn stageDataRat
    dependsOn stageData
}

tasks.register('generateDynamicFiles') {
    def jvmOptions = project.ext.mmJvmOptions.join('\n')

    doLast {
        new File("${projectDir}/docs/mm-revision.txt").text = versionDetails().gitHashFull
        new File("${projectDir}/MegaMek.l4j.ini").text = """# Launch4j runtime config
# you can add arguments here that will be processed by the JVM at runtime
${jvmOptions}
"""
    }
}

tasks.register("stageLicenseFiles", Sync) {
    description = "Copy the license files to the build folder."
    group = 'build'
    from "../"
    into "${layout.buildDirectory.get()}/licenses"

    includes = [
            'LICENSE',
            'LICENSE.code',
            'LICENSE.assets',
            'README.md'
    ]

}

if (suiteReleaseVersion != null) {
    tasks.register('clearSuiteStage', Delete) {
        delete fileStagingDir
    }
}

tasks.register("copyLicenseFiles", Copy) {
    description = "Copies from the build folder to the staging folder"
    group = 'build'

    dependsOn stageLicenseFiles
    if (suiteReleaseVersion != null) {
        dependsOn tasks.named('clearSuiteStage')
    }

    from "${layout.buildDirectory.get()}/licenses"
    into fileStagingDir
}

tasks.register('copyFiles', Copy) {
    description = 'Stages files that are to be copied into the distribution.'
    group = 'build'

    mustRunAfter(stageDataFiles)

    dependsOn copyLicenseFiles
    dependsOn generateDynamicFiles

    from projectDir
    include "data/**"
    include "docs/**"
    include "mmconf/**"
    include "SubmitBug.html"
    include "sentry.properties"
    include "*.ini"
    exclude "**/*.psd"

    // User Config Files
    exclude "mmconf/clientsettings.xml"
    exclude "mmconf/gameoptions.xml"
    exclude "mmconf/megameklab.properties"
    exclude "mmconf/megameklab.properties.bak"
    exclude "mmconf/mhq.preferences"
    exclude "mmconf/mm.preferences"
    exclude "mmconf/mml.preferences"
    exclude "mmconf/recent-advanced-searches.json"
    exclude "mmconf/recent_boards.yml"
    exclude "mmconf/searches/*.json"
    if (suiteReleaseVersion != null) {
        exclude "userdata/**"
    }

    include "userdata/"

    exclude("data/**/*.cache")

    into fileStagingDir
}

tasks.register('createImageAtlases', JavaExec) {
    if (suiteReleaseVersion != null) {
        dependsOn tasks.named('clearSuiteStage')
    }
    mustRunAfter(stageDataFiles)
    dependsOn copyFiles
    description = 'Combines individual image files into a set of image atlases.'
    group = 'utility'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "megamek.utilities.CreateImageAtlases"
    workingDir = file(fileStagingDir)
}

tasks.register('deleteAtlasedImages') {
    dependsOn createImageAtlases
    description = 'Removes images from the staging directory that have been incorporated into atlases.'
    doLast {
        if (file(atlasedImages).exists()) {
            ant.delete dir: fileStagingDir, includesfile: atlasedImages
            ant.delete file: atlasedImages
        }
    }
}

tasks.register('officialUnitList', JavaExec) {
    dependsOn jar
    mustRunAfter(stageDataFiles)
    description = 'Compiles a list of all units that come from official sources and saves it in the docs folder.'
    group = 'utility'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'megamek.MegaMek'
    args = ['-oul', "${projectDir}/docs/OfficialUnitList.txt"]
}


tasks.register('stageFiles') {
    description = 'Process data files to be included in distribution'
    group = 'distribution'
    mustRunAfter(stageDataFiles)
    dependsOn officialUnitList
    dependsOn deleteAtlasedImages

    doLast {
        mkdir "${fileStagingDir}/logs"
    }
}
if (suiteReleaseVersion != null) {
    tasks.named('copyFiles') { dependsOn tasks.named('clearSuiteStage') }
    tasks.named('stageFiles') { dependsOn tasks.named('clearSuiteStage') }
}

tasks.register('createStartScripts', CreateStartScripts) {
    description = 'Create shell script for generic distribution.'
    applicationName = 'MegaMek'
    mainClass = application.mainClass
    // MegaMek.sh runs this script.
    defaultJvmOpts = mmJvmOptions
