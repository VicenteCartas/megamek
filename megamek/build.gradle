// The ordinary release is cut with MekHQ's buildAllPackages, which pulls MegaMek and MegaMekLab in as
// included builds and ships all three together. A MegaMek-only release has no such task, so the steps
// below - clean slate, package, then check nothing local rode along - are the same procedure reduced to
// this one repository.
tasks.register('buildMegaMekPackage') {
    description = 'Builds the MegaMek-only release package. Use this in place of MekHQ buildAllPackages when ' +
            'MegaMek ships on its own.'
    group = 'distribution'

    dependsOn clean
    dependsOn assembleDist
    if (suiteReleaseVersion != null) {
        finalizedBy tasks.named('verifySuiteMegaMekArchive')
    }

    doLast {
        File releasePackage = layout.buildDirectory
                .file("distributions/MegaMek-${project.version}.tar.gz")
                .get()
                .asFile

        if (!releasePackage.exists()) {
            throw new GradleException("Expected release package ${releasePackage} was not produced.")
        }

        // Step 6 of the release procedure: a developer's own settings must never ship inside the archive.
        List<String> forbiddenFileNames = ['clientsettings.xml', 'gameoptions.xml', 'mm.preferences',
                                           'mml.preferences', 'mhq.preferences', 'megameklab.properties',
                                           'megameklab.properties.bak']
        List<String> foundFileNames = []
        tarTree(resources.gzip(releasePackage))
                .matching { forbiddenFileNames.each { forbiddenFileName -> include "**/${forbiddenFileName}" } }
                .visit { fileVisitDetails ->
                    if (!fileVisitDetails.directory) {
                        foundFileNames.add(fileVisitDetails.path)
                    }
                }

        if (!foundFileNames.isEmpty()) {
            throw new GradleException('Release package contains files that must not ship: '
                    + foundFileNames.join(', '))
        }

        logger.lifecycle("[Release] MegaMek ${project.version} packaged at ${releasePackage}")
        logger.lifecycle("[Release] Size: ${(releasePackage.length() / (1024 * 1024)).round(1)} MB")
    }
}

// Without this, a clean slate is not guaranteed: dependsOn does not order its own dependencies, so clean
// could run after the package was built and delete it.
assembleDist.mustRunAfter clean

test {
    useJUnitPlatform {
        excludeTags 'on-demand'
    }
    dependsOn(checkstyleMain)
    // Some tests read the shipped data set - faction rules, formation naming conventions - which
    // lives in mm-data and is copied into place by stageDataFiles. Without this the data is present
    // locally only if someone happened to stage it, and absent on CI, so such a test passes on a
    // developer machine and fails in the pipeline.
    dependsOn(stageDataFiles)

    minHeapSize = "1024m"
    maxHeapSize = "8192m"

    // The runtime's add-opens, so tests can exercise the XStream save-game path.
    jvmArgs mmAddOpens
    // Linked GL programs stay under build/, so test runs never evict the player's (mmconf/gpu-program-cache).
    systemProperty 'megamek.gpu.programCacheDir', layout.buildDirectory.dir('gpu-program-cache').get().asFile.absolutePath
    // Tests time and capture their own links: no shader warm-up process beside them (GpuShaderWarmup).
    systemProperty 'megamek.gpu.shaderWarmup', 'false'

    finalizedBy jacocoTestReport
}

// Explicit opt-in: the constrained heap makes whole-board raster retention a reproducible failure.
tasks.register('gpuBoardLargeMapTest', Test) {
    description = 'Captures a 200x200 GPU board at full resolution with a constrained Java heap'
    group = 'verification'
    dependsOn testClasses, stageDataFiles
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'on-demand' }
    filter {
        includeTestsMatching 'megamek.client.ui.clientGUI.boardview.gpu.GpuLargeMapTest'
        includeTestsMatching 'megamek.client.ui.clientGUI.boardview.gpu.GpuLargeMapSmokeTest'
    }
    minHeapSize = '128m'
    maxHeapSize = '512m'
    jacoco.enabled = false
    systemProperty 'java.awt.headless', 'false'
    systemProperty 'megamek.gpu.screenshots', layout.buildDirectory.dir('gpu-board-review').get().asFile.absolutePath
    systemProperty 'megamek.gpu.programCacheDir', layout.buildDirectory.dir('gpu-program-cache').get().asFile.absolutePath
    // Tests time and capture their own links: no shader warm-up process beside them (GpuShaderWarmup).
    systemProperty 'megamek.gpu.shaderWarmup', 'false'
    systemProperty 'megamek.gpu.materialCacheFillAtOnce', 'true'
}

// Explicit opt-in: requires an actual desktop OpenGL context, unlike the regular geometry/source tests.
tasks.register('gpuBoardSmoke', Test) {
    description = 'Renders the GPU battle view with shipped artwork and saves top/isometric screenshots'
    group = 'verification'
    dependsOn testClasses, stageDataFiles
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // The benchmarks print timings and assert only that GL reports no error; gpuBoardBenchmark runs them.
    useJUnitPlatform {
        includeTags 'on-demand'
        excludeTags 'gpu-benchmark'
    }
    filter {
        includeTestsMatching 'megamek.client.ui.clientGUI.boardview.gpu.*SmokeTest'
        includeTestsMatching 'megamek.client.ui.gdx.*SmokeTest'
    }
    jvmArgs = mmJvmOptions
    // Native frame timings must not include bytecode coverage overhead; regular tests supply coverage.
    jacoco.enabled = false
    systemProperty 'java.awt.headless', 'false'
    systemProperty 'megamek.gpu.screenshots', layout.buildDirectory.dir('gpu-board-review').get().asFile.absolutePath
    systemProperty 'megamek.gpu.programCacheDir', layout.buildDirectory.dir('gpu-program-cache').get().asFile.absolutePath
    // Tests time and capture their own links: no shader warm-up process beside them (GpuShaderWarmup).
    systemProperty 'megamek.gpu.shaderWarmup', 'false'
    // Every frame a test reads shows the ground material cache built, never its stand-ins (GpuMaterialCache).
    systemProperty 'megamek.gpu.materialCacheFillAtOnce', 'true'
    systemProperties System.properties.findAll { it.key.toString().startsWith('megamek.gpu.') }
    outputs.upToDateWhen { false }
}

// Explicit opt-in: the GPU benchmarks among the smoke classes, which report timings (ground cover, forests, biome
// zooms, board performance) rather than check what is drawn. Their knobs are the megamek.gpu.* system properties.
tasks.register('gpuBoardBenchmark', Test) {
    description = 'Runs the GPU board benchmarks, which print timing reports instead of checking the rendering'
    group = 'verification'
    dependsOn testClasses, stageDataFiles
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'gpu-benchmark' }
    filter {
        includeTestsMatching 'megamek.client.ui.clientGUI.boardview.gpu.*SmokeTest'
    }
    jvmArgs = mmJvmOptions
    jacoco.enabled = false
    systemProperty 'java.awt.headless', 'false'
    systemProperty 'megamek.gpu.screenshots', layout.buildDirectory.dir('gpu-board-review').get().asFile.absolutePath
    systemProperty 'megamek.gpu.programCacheDir', layout.buildDirectory.dir('gpu-program-cache').get().asFile.absolutePath
    // Tests time and capture their own links: no shader warm-up process beside them (GpuShaderWarmup).
    systemProperty 'megamek.gpu.shaderWarmup', 'false'
    systemProperties System.properties.findAll { it.key.toString().startsWith('megamek.gpu.') }
    testLogging { showStandardStreams = true }
    outputs.upToDateWhen { false }
}

// Explicit opt-in: times CPU terrain chunk preparation on a region of a real board and digests its output, so a
// loading speed-up can be compared against the geometry and materials it must not change.
tasks.register('gpuTerrainLoadBenchmark', Test) {
    description = 'Times terrain chunk preparation for a board region and prints a digest of the result'
    group = 'verification'
    dependsOn testClasses, stageDataFiles
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'on-demand' }
    filter {
        includeTestsMatching 'megamek.client.ui.clientGUI.boardview.gpu.GpuTerrainLoadBenchmarkTest'
    }
    def recording = System.getProperty('megamek.gpu.benchmarkJfr')
    jvmArgs = recording == null ? mmJvmOptions
          : mmJvmOptions + ['-XX:StartFlightRecording=filename=' + recording + ',settings=profile,dumponexit=true']
    jacoco.enabled = false
    systemProperties System.properties.findAll { it.key.toString().startsWith('megamek.gpu.benchmark') }
    testLogging { showStandardStreams = true }
    outputs.upToDateWhen { false }
}

jacocoTestReport {
