MovementDisplay.climbModeTip.wige=<html>WiGE movement.<br><b>Follow Terrain</b>: fly one level above the ground, dropping with it at no extra cost.<br><b>Keep Elev</b>: hold your altitude over lower terrain, at +2 MP for each hex (TW p.55).</html>
MovementDisplay.climbModeTip.upCliff=<html>Adjacent hex is a {0}-level cliff up.<br><b>Climbing</b>: ascend with TacOps climbing rules (PSR per level).<br><b>Move Thru</b>: cannot ascend (step is illegal).</html>
MovementDisplay.climbModeTip.upCliff.standard=<html>Adjacent hex is a {0}-level cliff up &mdash; too high for a normal step.<br><b>TacOps Climbing OFF</b>: step is illegal in either mode.<br>Enable TacOps Climbing in Game Options to scale this.</html>
MovementDisplay.climbModeTip.upBuilding=<html>Adjacent hex is a {0}-level building.<br><b>Climbing</b>: scale the wall to the roof with TacOps climbing rules (PSR per level).<br><b>Move Thru</b>: enter the building at ground level by going through the wall (takes wall-collision damage).</html>
MovementDisplay.climbModeTip.upBuilding.standard=<html>Adjacent hex is a {0}-level building &mdash; too tall to reach the roof in a normal step.<br><b>Climbing</b>: cannot reach the roof &mdash; TacOps Climbing OFF, step is illegal.<br><b>Move Thru</b>: still works &mdash; enter at ground level by going through the wall (takes wall-collision damage).<br>Enable TacOps Climbing in Game Options to scale the wall to the roof.</html>
MovementDisplay.climbModeTip.atEdge=<html>Standing on a {0}-level drop edge.<br><b>Climbing</b>: stepping off opens the descent dialog (Dangle / Climb Down / Drop).<br><b>Move Thru</b>: no dialog &mdash; a leap if TacOps Leaping is on, otherwise the step is illegal.</html>
MovementDisplay.climbModeTip.atEdge.leaping=<html>Standing on a {0}-level drop edge.<br><b>TacOps Climbing OFF</b>: no Dangle/Drop dialog.<br><b>TacOps Leaping ON</b>: stepping off triggers a leap with fall mechanics (leg damage / fall PSR).</html>
MovementDisplay.climbModeTip.atEdge.standardIllegal=<html>Standing on a {0}-level drop edge.<br><b>TacOps Climbing and TacOps Leaping both OFF</b>: step is illegal.<br>Enable one of the rules or go around.</html>
MovementDisplay.climbModeTip.building=<html>Building adjacent or in current hex.<br><b>Climbing</b>: prefer to go over the roof.<br><b>Move Thru</b>: prefer to go through walls (takes damage).</html>
MovementDisplay.climbModeTip.bridge=<html>This setting controls what happens when your move <b>steps INTO a bridge hex</b>:<br><b>Climbing</b>: ends on the bridge surface (walks on at a bridge end, or climbs the side with TacOps Climbing).<br><b>Move Thru</b>: passes underneath the bridge if your unit fits beneath it. Per TO:AR p.115, if the unit cannot fit under, it is <i>forced onto the bridge surface</i> &mdash; this is a common surprise.<br><br>To walk <i>around</i> the bridge instead, plot a path through adjacent hexes that don't contain bridge terrain. This toggle has no effect on those steps.</html>
MovementDisplay.climbModeTip.bridge.standard=<html>This setting controls what happens when your move <b>steps INTO a bridge hex</b>:<br><b>Climbing</b>: ends on the bridge surface if reachable in a normal step (bridge end at land level, or no more than {@code maxElevationChange} levels above the surrounding terrain).<br><b>Move Thru</b>: passes underneath if the unit fits. Per TO:AR p.115, if it cannot fit under, the unit is <i>forced onto the bridge surface</i>.<br><b>TacOps Climbing OFF</b>: tall bridges can't be scaled from the side &mdash; only reachable from bridge-end hexes that meet land at bridge level.<br><br>To walk <i>around</i> the bridge, plot a path through adjacent hexes that don't contain bridge terrain.</html>
MovementDisplay.climbModeTip.none=<html>No climbable terrain or building/bridge in facing arc.<br>Climb Mode toggle has no effect here.</html>
