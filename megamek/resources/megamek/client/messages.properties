UiLibrary.controls.toasts=Toasts
UiLibrary.toasts.note=A toast is a short notice that comes and goes at the top centre of the view: a bar and an icon \
  in its level's color, the text, and a cross. It never asks anything and never takes the focus. Errors stay longest; \
  the pointer over a toast pauses it, and at most five show at once, the newest on top.
