#Force Generator Dialog
ForceGeneratorDialog.title=Force Generator
ForceGeneratorDialog.year=Year:
ForceGeneratorDialog.year.tooltip=<html>The in-game year for the generated force.<br/>Drives which units are available from the RAT data and which faction-specific organization rules apply.<br/>Changing the year refreshes the faction list to those active in that year.</html>
ForceGeneratorDialog.faction=Faction:
ForceGeneratorDialog.faction.tooltip=<html>The primary faction to generate the force for.<br/>The faction's ruleset (under <code>data/forcegenerator/faction_rules/</code>) drives echelon structure, command ranks, weight distributions, and unit availability.<br/>Only factions active in the selected year are listed.<br/>Generation accuracy varies by faction. The Great Houses and major Clans have detailed rulesets; minor, obscure, and short-lived factions fall back on generic rules, so their commands are less faithful to how they were really organized.</html>
ForceGeneratorDialog.subfaction=Subfaction:
ForceGeneratorDialog.subfaction.tooltip=<html>An optional sub-command within the selected faction (e.g., Sword of Light for DC, Kindraa Kline for CFM, Ceti Hussars for FedSuns).<br/>Selecting a sub-faction may produce distinct formations, different ratings, or unique unit availability.<br/>Leave blank to use the parent faction's standard ruleset.</html>
ForceGeneratorDialog.unitType=Unit Type:
ForceGeneratorDialog.unitType.tooltip=<html>The primary unit type for the generated force. Each choice exposes a different list of available echelons.<br/>Pick a specific type (Mek, Tank, Aero, etc.) for a single-arm formation, which is limited to the echelons that arm alone forms.<br/><b>Combined Arms</b> unlocks the larger multi-arm formations - Clan Cluster/Galaxy/Touman, FedSuns RCT, ComStar Level III/IV/V, Marik Combined Arms - because those are built from several arms together.<br/><i>Combined Arms is required to generate a Clan Cluster: the single-arm Clan choices stop at Trinary.</i></html>
ForceGeneratorDialog.formation=Formation:
ForceGeneratorDialog.formation.tooltip=<html>The echelon level (size) of the generated force.<br/>Available echelons depend on the selected faction and unit type.<br/>Suffix codes: <b>^</b> = augmented (Clan Nova/Supernova, Blakist Choir, Capellan augmented lance); <b>+</b> = reinforced; <b>-</b> = understrength.</html>
ForceGeneratorDialog.rating=Equipment Rating:
ForceGeneratorDialog.rating.A=Best Available
ForceGeneratorDialog.rating.B=Above Average
ForceGeneratorDialog.rating.C=Standard
ForceGeneratorDialog.rating.D=Below Average
ForceGeneratorDialog.rating.F=Obsolete
ForceGeneratorDialog.rating.Keshik=Command
ForceGeneratorDialog.rating.tooltip=<html>The unit-equipment quality rating for the force, per the Field Manual RATs. Higher ratings shift \
the tables toward newer and rarer designs and raise the faction's upgraded/Clan/omni tech percentages; lower ratings keep older \
and obsolete equipment in service longer.<br/>\
<b>Inner Sphere / Periphery (A-F):</b><br/>\
&nbsp;&nbsp;<b>A</b> - elite front-line commands with priority access to the newest and best equipment<br/>\
&nbsp;&nbsp;<b>B</b> - veteran front-line units, well equipped with above-average tech<br/>\
&nbsp;&nbsp;<b>C</b> - a typical line unit: the faction's baseline equipment mix (the default)<br/>\
&nbsp;&nbsp;<b>D</b> - second-line and militia formations fielding aging equipment with few upgrades<br/>\
&nbsp;&nbsp;<b>F</b> - garrison and reserve formations with the poorest gear; obsolete and primitive designs persist<br/>\
<b>Star League and ComStar/WoB:</b> A, B, C (same scale, no D/F tiers)<br/>\
<b>Clan:</b> Keshik (command/elite), FL (Front Line), SL (Second Line), PG (Provisional Garrison), Sol (Solahma)<br/>\
<b>Republic of the Sphere:</b> SB (Stone's Brigade), HS (Hastati Sentinels), PG (Principes Guards), TP (Triarii Protectors)<br/>\
Some echelons restrict which ratings are valid (e.g., a Clan Galaxy only allows FL/SL).</html>
ForceGeneratorDialog.search=Search TO&E:
ForceGeneratorDialog.search.tooltip=<html>Find anything in the order of battle: unit names, pilots, ship names, or formation/cluster names.<br/>The match is selected and scrolled into view; use Next/Prev (or Enter) to step through all matches.</html>
ForceGeneratorDialog.search.placeholder=Find a unit, pilot or formation
ForceGeneratorDialog.search.prev=Prev
ForceGeneratorDialog.search.next=Next
ForceGeneratorDialog.search.noMatches=No matches
ForceGeneratorDialog.weight=Target Weight:
ForceGeneratorDialog.weight.tooltip=<html>A target weight class for the force (Light/Medium/Heavy/Assault).<br/>Propagates through subforces to drive the desired weight distribution.<br/>Randomness in unit selection means the actual force average may fall in an adjacent band, especially for small formations.</html>
ForceGeneratorDialog.insufficientData.title=Insufficient Data to Generate Force
ForceGeneratorDialog.insufficientData.text=<html>Insufficient Data to Generate Force.<br/>The unit tables have nothing that fits these settings for this faction and year.<br/>Try another year, faction, rating or unit type.</html>
ForceGeneratorDialog.infantryClass=Infantry Class:
ForceGeneratorDialog.infantryClass.tooltip=<html>The kind of conventional infantry to generate. Every line platoon is of this kind.<br/>Light: foot. Motorized: light vehicles. Mechanized: tracked, wheeled or hover carriers.<br/>Jump: jump packs, microcopters and microlites. Beast: troops riding animals, all on the same animal.<br/>Aquatic: scuba and submarine. Attached support (field guns, artillery, engineers) keeps its own kind.<br/>Infantry companies do not convert to battle armor when a class is picked. Random leaves the mix to the faction rules.</html>
ForceGeneratorDialog.infantryClass.light=Light (Foot)
ForceGeneratorDialog.infantryClass.motorized=Motorized
ForceGeneratorDialog.infantryClass.mechanized=Mechanized
ForceGeneratorDialog.infantryClass.jump=Jump
ForceGeneratorDialog.infantryClass.beast=Beast
ForceGeneratorDialog.infantryClass.aquatic=Aquatic
ForceGeneratorDialog.weight.ignored.tooltip=<html>Greyed out because VTOLs and conventional fighters are not picked by weight class.<br/>Every weight draws from the same table, so the force is generated as Random.</html>
ForceGeneratorDialog.other=Faction Options:
ForceGeneratorDialog.other.tooltip=<html>Faction-specific options that modify the generated formation.<br/>Examples: Clan cluster type (Assault, Strike, Cavalry, Horde, Ad-Hoc, Ranger); ComStar/WoB Mek-Tank-Infantry ratio (alpha/beta/gamma/delta/epsilon); Federated Suns Light Combat Team; Goliath Scorpion specialty cluster types.<br/>Set as a flag on the root force node and inherited by subforces.</html>
ForceGeneratorDialog.experience=Experience Target:
ForceGeneratorDialog.experience.tooltip=<html>The target average experience for crews in the force.<br/><b>Random</b>: each crew is assigned independently from faction defaults.<br/><b>Green</b>: gunnery ~5, piloting ~6 (Total Warfare baseline).<br/><b>Regular</b>: gunnery 4, piloting 5.<br/><b>Veteran</b>: gunnery 3, piloting 4.<br/><b>Elite</b>: gunnery 2, piloting 3.<br/>Individual crews still vary; larger formations converge on the target more tightly.</html>
ForceGeneratorDialog.generateDetachments=Generate Detachments
ForceGeneratorDialog.generateDetachments.tooltip=<html>When checked, also generates the detachments attached to the primary formation - armor, aerospace, and infantry support.<br/>Examples:<br/>- Mek regiment: aerospace wing + armor battalion + infantry regiment<br/>- Armor regiment (era-dependent): Mek company/battalion + infantry regiment<br/>- Clan FL clusters (post-3060): ProtoMek star/binary/trinary<br/>- Most ground formations: artillery binary if available<br/>Driven by <code>&lt;attachedForces&gt;</code> entries in the faction ruleset.</html>
ForceGeneratorDialog.transport=Transport:
ForceGeneratorDialog.transport.tooltip=<html>How much of the force to generate transport for. Each setting is a percentage of what the force needs; 0 generates none of that kind of ship.</html>
ForceGeneratorDialog.dropshipPercentage=DropShip Percentage:
ForceGeneratorDialog.dropshipPercentage.tooltip=<html><b>How much of the force can ride to the surface at once.</b><br/>Generates Troopships with unit bays for that share of the command - Mek bays for Meks, vehicle bays for tanks, and so on, each sized to what the force actually contains.<br/><b>100</b> lifts the whole command in one wave. <b>50</b> lifts half, so it lands in two. <b>0</b> generates no Troopships at all.<br/>Above 100 buys spare bays for units acquired later.<br/>Lift the command already has - ships from earlier rolls and ships you already own in the game - is counted first, so a later roll only adds what is still short. Hulls are chosen to be well used: two or three ships that fit rather than one with empty bays.<br/><i>This covers units only. Spares, ammunition and armour are cargo - see Cargo Capacity % below.</i></html>
ForceGeneratorDialog.jumpshipPercentage=JumpShip Percentage:
ForceGeneratorDialog.jumpshipPercentage.tooltip=<html><b>How many of those DropShips can be carried between star systems.</b><br/>A DropShip crosses a system on its own but cannot jump; it needs a docking collar on a JumpShip. This generates collars for that share of the DropShip fleet.<br/>Collars vary by class - a Scout has 1, an Invader 3, a Monolith 9 - so the number of JumpShips depends on which designs the faction and era offer.<br/>The DropShips a JumpShip berths are shown docked beneath it, and free collars on ships the command already has are used before a new JumpShip is drawn.<br/><b>100</b> berths every DropShip. <b>0</b> generates no JumpShips whatsoever, including for any cargo ships, leaving a command that cannot leave the system under its own power.<br/>Independent of the WarShip percentage; combine the two to split coverage.</html>
ForceGeneratorDialog.warshipPercentage=WarShip Percentage:
ForceGeneratorDialog.warshipPercentage.tooltip=<html><b>The same berths, but on warships instead of civilian jump transports.</b><br/>WarShips carry docking collars like JumpShips while also fighting, so a command with them is far more expensive and far more capable. The DropShips a WarShip berths are shown docked beneath it.<br/><b>0</b> generates none. Independent of the JumpShip percentage - 50 here and 50 there berths the fleet half on each.<br/><i>Only produces ships for factions building WarShips in the selected year; most eras and most factions have none.</i></html>
ForceGeneratorDialog.cargoPct=Cargo Capacity %:
ForceGeneratorDialog.cargoPct.tooltip=<html>How much of the command's cargo requirement to provision hauling for.<br/><b>100</b> (the default) generates enough cargo DropShips to carry everything the command has to haul - spares, ammunition and armour in the warehouse.<br/>Above 100 adds headroom: <b>150</b> carries all of it with half again as much space free for cargo picked up later.<br/><b>0</b> generates no cargo DropShips.<br/>Solid and liquid holds are counted separately, since neither substitutes for the other.<br/>Units themselves are not cargo - they ride in unit bays, sized by the DropShip Percentage above.<br/><i>The cargo ships are generated and crewed at the end of the build, and are paid for like any other unit.</i></html>
ForceGeneratorDialog.fighterComplement=<html>Carried Fighter<br/>Complement</html>
ForceGeneratorDialog.fighterComplement.tooltip=<html>For each WarShip, DropShip, JumpShip, and Space Station in the force, generate the Aerospace Fighters it carries (filled to the ship's fighter bays) and nest them under the ship.<br/>When the force is added to the game, those fighters start aboard their ship.<br/>This does not find ships for fighters the force already has; set DropShip Percentage for that.<br/>Off by default.</html>
ForceGeneratorDialog.fighterComplement.noShips.tooltip=<html>Greyed out because nothing in this roll will have fighter bays to fill.<br/>Set a DropShip, JumpShip or WarShip percentage above zero, or generate a formation of ships, and it becomes available.</html>
ForceGeneratorDialog.generate=Generate
ForceGeneratorDialog.generate.tooltip=<html>Generate a force using the selected parameters.<br/>Runs in the background; the UI stays responsive and shows a progress dialog you can cancel from.<br/>Each roll is added to the Command Model on the right, and the ships it needs are folded into the command's naval branch, counting the lift earlier rolls and the game already provide. Clear Force starts over.</html>
ForceGeneratorDialog.exportMUL=Export MUL...
ForceGeneratorDialog.exportMUL.tooltip=<html>Write the entire generated force to a MUL file via a save dialog.<br/>The flat MUL format does not preserve the hierarchy — all entities are written as a single unit list.<br/>To export a single sub-force (a Trinary, a Lance), right-click that node in the force tree and choose Export.</html>
ForceGeneratorDialog.exportMUL.title=Export Force to MUL
ForceGeneratorDialog.exportMUL.error=Error while saving file
ForceGeneratorDialog.exportMUL.empty=No entities to export.
ForceGeneratorDialog.addToGame=Add to Game
ForceGeneratorDialog.addToGame.tooltip=<html>Put what is selected in the force tree on the chosen units list: a single unit, or a formation with everything in it.<br/>The same as right-clicking the selection and choosing Add to Game. Excluded units are skipped.<br/>The chosen units go into the game when you press Okay.</html>
ForceGeneratorDialog.clear=Clear Force
ForceGeneratorDialog.clear.tooltip=<html>Clear the Command Model and the force tree and release their memory.<br/>Use when finished extracting units, to start a fresh command, or to leave the lobby empty.</html>
