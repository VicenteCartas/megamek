UiLibrary.scrollbars.log=Round 3, movement phase: the Atlas AS7-D walks 3 hexes to the ridge and turns to face the river crossing.\n\
Round 3, firing phase: the Marauder MAD-3R fires both PPCs at the Phoenix Hawk PXH-1 and hits the left torso.\n\
Round 3, physical phase: the Hunchback HBK-4G punches the Locust LCT-1V, which fails its piloting roll and falls.\n\
Round 3, heat phase: the Marauder MAD-3R builds 8 heat and its targeting slows next turn.\n\
Round 4, initiative: the Kell Hounds win with 9 against 6.\n\
Round 4, movement phase: the Wasp WSP-1A jumps 6 hexes into the woods behind the Catapult CPLT-C1.\n\
Round 4, firing phase: the Catapult CPLT-C1 fires both LRM 15 racks at the Rifleman RFL-3N.\n\
Round 4, end phase: the Locust LCT-1V stands up and the Atlas AS7-D cools down to 2 heat.\n\
Round 5, initiative: the Kell Hounds lose with 4 against 10.\n\
Round 5, movement phase: the BattleMaster BLR-1G runs 5 hexes and takes cover behind the ridge.\n\
Round 5, firing phase: the Griffin GRF-1N fires its PPC at the Commando COM-2D and misses.\n\
Round 5, end phase: the Awesome AWS-8Q shuts down after its third PPC volley.
