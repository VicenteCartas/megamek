UiLibrary.controls.panels=Panels
UiLibrary.panels.note=Anything that isn't a dialog, such as a sidebar, a unit card or a grouped area, sits in a panel \
  with the dialog card's frame. The header is optional: a title, a status icon and actions at its trailing end. A \
  status ticks the corners in its color, always with its icon. A selectable panel is a control: the edge shows the \
  pointer, the selection turns it violet and keyboard focus rings it. Inside a panel, groups use the plain frame, \
  so only the outermost frame has ticks.
