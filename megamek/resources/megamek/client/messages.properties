GameOptionsDialog.page.landing.title=Game Options
GameOptionsDialog.page.landing.intro=Across the Inner Sphere, commanders inherit centuries of doctrine, hard-won field experience, and arguments about how war ought to be fought. Before the first unit deploys, choose the rules system that will govern this engagement. You can then use the navigation tree to tailor match setup, combat, movement, aerospace, initiative, and optional rules to the battle your group wants to play.
GameOptionsDialog.page.landing.quote="A commander may choose the ground, the hour, and the forces committed, but every warrior must enter the field knowing which laws of battle bind friend and foe alike. Set those terms before the first order is given; clarity at the planning table prevents confusion when the weapons begin to speak."<br><i>- An old maxim shared among military academies across the Inner Sphere</i>
GameOptionsDialog.page.landing.rulesSystem.core=Core rules (2026) will be used. These rules are primarily 'Mek focused, but have several changes compared to prior rules. Options that are not compatible or overridden with this rules system will be greyed out and disabled in the Game Options.
GameOptionsDialog.page.landing.rulesSystem.totalWarfare=Total Warfare (2006) rules will be used. Although this is selected, some changes from Core will still be present. Bombast Lasers will use Core rules, and the Light and Heavy Plasma Rifles are available for use. Artemis IV is also available for Extended LRMs if a unit has it installed.
