UnitEditorDialog.skillModifier.gunnery.tooltip=Added to the crew's gunnery skill while the modifier lasts. Negative improves the crew, positive worsens it. The range runs from what improves the skill to 0 up to what worsens it to 8, so every offered value applies in full. Set the modifier to 0 to clear it.
