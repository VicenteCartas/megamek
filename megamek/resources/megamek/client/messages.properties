#Formation Type tooltips (Campaign Operations rules summary)
FormationType.Anti-Mek.tooltip=Infantry/battle armor formation trained to swarm and disrupt enemy Meks. (CamOps p. 61)
FormationType.Assault.tooltip=Slow but heavily armed and armored. Ideal role: Juggernaut. (CamOps p. 61)
FormationType.Anvil.tooltip=House Marik Assault variant trained to hold ground while heavier units engage. Ideal role: Juggernaut. (CamOps p. 62)
FormationType.Fast_Assault.tooltip=Assault variant requiring Walk/Cruise 5+ or jump capability on every unit. (CamOps p. 62)
FormationType.Hunter.tooltip=Assault variant favoring heavy woods or urban terrain for ambush combat. Ideal role: Ambusher. (CamOps p. 62)
FormationType.Battle.tooltip=Standard line formation; closes with the enemy on armor and firepower. Ideal role: Brawler. (CamOps p. 62)
FormationType.Light_Battle.tooltip=Light-weight Battle Lance variant requiring at least one Scout. (CamOps p. 63)
FormationType.Medium_Battle.tooltip=Medium-weight Battle Lance variant. (CamOps p. 63)
FormationType.Heavy_Battle.tooltip=Heavy-weight Battle Lance variant; light-weight units are excluded. (CamOps p. 63)
FormationType.Rifle.tooltip=House Davion Battle Lance variant built around autocannons and Walk/Cruise 4+. (CamOps p. 63)
FormationType.Berserker_Close.tooltip=Mek-only Battle variant trained to close with and physically attack the enemy. Ideal role: Brawler. (CamOps p. 63)
FormationType.Command.tooltip=Built around the force commander, with diverse capabilities to support and protect the leader. (CamOps p. 63)
FormationType.Order.tooltip=House Kurita Command variant where every unit shares model and weight class. (CamOps p. 63)
FormationType.Vehicle_Command.tooltip=Command variant for combat vehicles, with one matched pair fulfilling the role requirement. (CamOps p. 63)
FormationType.Fire.tooltip=Long-range fire formation engaging from a safe distance. Ideal role: Missile Boat. (CamOps p. 64)
FormationType.Anti-Air.tooltip=Fire variant emphasizing AC, LBX, artillery, or units with the Anti-Aircraft Targeting Quirk. (CamOps p. 64)
FormationType.Artillery_Fire.tooltip=Fire variant requiring at least two artillery-armed units. (CamOps p. 64)
FormationType.Direct_Fire.tooltip=Fire variant requiring all units deliver at least 10 damage at range 18. (CamOps p. 64)
FormationType.Fire_Support.tooltip=Fire variant requiring at least three units with indirect-fire capability. (CamOps p. 64)
FormationType.Light_Fire.tooltip=Fire variant restricted to light/medium weight; at least 50% must be Missile Boat or Sniper. (CamOps p. 64)
FormationType.Pursuit.tooltip=High-speed scout-hunter formation built for mobility and selective firepower. Ideal role: Striker. (CamOps p. 65)
FormationType.Probe.tooltip=Pursuit variant excluding assault weight; all units deliver 10+ damage at range 9. (CamOps p. 65)
FormationType.Sweep.tooltip=Pursuit variant for short-range damage at speed; all units deliver 10+ damage at range 6. (CamOps p. 65)
FormationType.Recon.tooltip=Fast scouting formation that runs ahead to gather intelligence and harass enemies. Ideal role: Scout. (CamOps p. 65)
FormationType.Heavy_Recon.tooltip=Recon variant including a heavy-weight backbone; excludes infantry/VTOL. (CamOps p. 65)
FormationType.Light_Recon.tooltip=Recon variant restricted to light weight and the Scout role. (CamOps p. 65)
FormationType.Security.tooltip=Defensive formation built for independent operations; at most one assault unit allowed. (CamOps p. 65)
FormationType.Striker_Cavalry.tooltip=Fast-moving formation that brings firepower in quickly and can withdraw. Ideal role: Striker. (CamOps p. 66)
FormationType.Hammer.tooltip=House Marik Striker variant trained to flank or rear-attack while Anvil holds the front. Ideal role: Striker. (CamOps p. 66)
FormationType.Heavy_Striker_Cavalry.tooltip=Heavy-weight Striker/Cavalry variant requiring long-range firepower. (CamOps p. 66)
FormationType.Horde.tooltip=Striker variant of light Meks swarming larger opponents through numbers (5-10 units). (CamOps p. 66)
FormationType.Light_Striker_Cavalry.tooltip=Light-weight Striker/Cavalry variant emphasizing long-range damage. (CamOps p. 66)
FormationType.Ranger.tooltip=Striker/Cavalry variant trained for combat in difficult terrain. Ideal role: Skirmisher. (CamOps p. 66)
FormationType.Support.tooltip=Multi-role formation that backs up other formations; no inherent requirements. (CamOps p. 66)
FormationType.Urban.tooltip=Favors jump movement and slow units for short-range city fighting. Ideal role: Ambusher. (CamOps p. 67)
FormationType.Aerospace_Superiority_Squadron.tooltip=Air-combat counterpart to the Battle Lance, built around Interceptor and Fast Dogfighter roles. (CamOps p. 67)
FormationType.Electronic_Warfare_Squadron.tooltip=Fighter formation dedicated to disrupting enemy communications via Probe, ECM, or TAG equipment. (CamOps p. 67)
FormationType.Fire_Support_Squadron.tooltip=Aerospace formation suited to ground-attack and long-range engagement, blending Fire Support and Dogfighter roles. (CamOps p. 68)
FormationType.Interceptor_Squadron.tooltip=Fast aerospace formation built to deliver the first strike against opposing aerospace threats. (CamOps p. 68)
FormationType.Strike_Squadron.tooltip=Aerospace formation suited to close air support and ground-attack, balancing firepower with armor. (CamOps p. 68)
FormationType.Transport_Squadron.tooltip=Aerospace cargo/troop-movement formation; may include support aircraft, fighters, small craft, or DropShips. (CamOps p. 68)
