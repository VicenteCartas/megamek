UnitEditorDialog.skillModifier.target=Target Modifier
UnitEditorDialog.skillModifier.target.tooltip=Added to the target movement modifier attackers get against this unit, for the rest of this round only. Positive makes it harder to hit. It goes down only as far as the modifier the unit earned by moving, so the total never goes negative, and the total is held to the top of the movement table, so it cannot go beyond what movement could earn.
