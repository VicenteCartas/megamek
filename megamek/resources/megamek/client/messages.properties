UiLibrary.controls.chips=Filter and tag chips
UiLibrary.chips.note=Chips are small rounded controls. A filter chip is a toggle that narrows a view, violet with a \
  check when on; a tag chip is a value the user added, with a cross that removes it (or Delete with the focus on it).
UiLibrary.controls.badges=Status chips and badges
UiLibrary.badges.note=A status chip reports a state with its icon and an edge in the status color. A badge counts \
  something new on a button's corner, in the accent unless the count means a status, or shows a dot when the number \
  doesn't matter.
