# The Commands button on the command bar and the game commands it offers
GameCommands.title=Commands
GameCommands.tooltip=Game commands: declare victory, admit defeat, check remaining battle value, skip a stuck turn, reset or kick, and the Game Master tools
GameCommands.RequestVictory.title=Request Victory
GameCommands.RequestVictory.tooltip=Declare victory for you or your team at the end of this turn. Every opponent must agree by admitting defeat.
GameCommands.RequestVictory.confirm.title=Request Victory
GameCommands.RequestVictory.confirm.message=Declare victory for you or your team at the end of this turn?\n\nThe game only ends if every opponent agrees by choosing Admit Defeat.
GameCommands.AdmitDefeat.title=Admit Defeat
GameCommands.AdmitDefeat.tooltip=Concede the game. If an opponent has declared victory, this agrees to it; otherwise it announces that you want to surrender.
GameCommands.AdmitDefeat.confirm.title=Admit Defeat
GameCommands.AdmitDefeat.confirm.message=Concede the game?\n\nIf an opponent has declared victory, the game ends at the end of this turn.
GameCommands.SkipTurn.title=Skip Current Turn
GameCommands.SkipTurn.tooltip=Skip the turn of the player who is up now. The Game Master can skip any turn. Other players can only skip a stuck turn. Use with care.
GameCommands.SkipTurn.confirm.title=Skip Current Turn
GameCommands.SkipTurn.confirm.message=Are you sure? Skipping a turn can have unintended consequences.\n\nThe player who is up now loses their unit's action for this turn, and it cannot be undone.\nUse it only when the game is stuck or you are sure it is needed.
GameCommands.ResetGame.title=Reset Game
GameCommands.ResetGame.tooltip=End the current game for everyone and return the server to the lobby. On a passworded server, type /reset <password> in chat instead.
GameCommands.ResetGame.confirm.title=Reset Game
GameCommands.ResetGame.confirm.message=End the current game for everyone and return the server to the lobby?\n\nThe game is not saved first.
GameCommands.KickPlayer.title=Kick Player
GameCommands.KickPlayer.tooltip=Disconnect a player from the server. The player becomes a ghost and can rejoin. On a passworded server the form asks for the password.
GameCommands.CheckBvPlayers.title=Check Battle Value (Players)
GameCommands.CheckBvPlayers.tooltip=Show each player's remaining battle value in the chat window
GameCommands.CheckBvTeams.title=Check Battle Value (Teams)
GameCommands.CheckBvTeams.tooltip=Show each team's remaining battle value in the chat window
GameCommands.ReportBug.title=Report a Bug
GameCommands.ReportBug.tooltip=Open the bug report helper, which can package this game and its logs into a single file to attach to an issue report
GameCommands.RequestGameMaster.title=Request Game Master Role
GameCommands.RequestGameMaster.tooltip=Ask to become the Game Master. During play every other player on a team must agree by choosing Allow Game Master.
GameCommands.GiveUpGameMaster.title=Give Up Game Master Role
GameCommands.GiveUpGameMaster.tooltip=Hand back the Game Master role, so that another player can take it
GameCommands.AllowGameMaster.title=Allow Game Master
GameCommands.AllowGameMaster.tooltip=Agree to another player's pending request to become the Game Master
GameCommands.DenyGameMaster.title=Deny Game Master
GameCommands.DenyGameMaster.tooltip=Vote no on another player's pending request to become the Game Master
GameCommands.CancelGameMasterRequest.title=Cancel Game Master Request
GameCommands.CancelGameMasterRequest.tooltip=Take back your own pending request to become the Game Master
