# GPU battle HUD (hud-v3). Keys are GpuBoard.hud.<component>.<name>. A value with {n} arguments is a MessageFormat
# pattern read with Messages.getString(key, args): apostrophes are doubled and plurals use {n,choice,...}. A value
# without arguments is plain text, read only with Messages.getString(key): passing arguments would run MessageFormat
# and drop its single apostrophes. Upper case is applied at display time. Bound keys (Esc is the CANCEL bind)
# are always arguments holding the current KeyCommandBind text, never literals; mouse gestures and the focused
# grip's Alt+↑/↓ are fixed, not binds. Plain Close, Cancel, Left and Right buttons use the generic keys.
