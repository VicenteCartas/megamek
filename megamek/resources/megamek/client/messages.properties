VictoryHex.describe.standard=What it does: both sides score each turn they control at least one friendly and one enemy point (double for controlling all of them); the most victory points when the game ends wins. How to make it work: keep a strict majority of units in your points' zones while contesting theirs - control is re-checked every turn, nothing is ever carried over.
VictoryHex.describe.raid=What it does: nothing scores during play - whoever controls this point when the game ends receives its victory points. How to make it work: only the final turn's control matters, so win the zone late; holding it all game earns nothing extra.
VictoryHex.describe.hold.consecutive=What it does: the first side to hold this point for {0} unbroken turns secures it and scores its victory points - either side can win it. How to make it work: keep a strict majority in the zone every single turn; any turn without majority, even a single enemy forcing a tie, resets your count to zero.
VictoryHex.describe.hold.cumulative=What it does: the first side to hold this point for {0} turns in total secures it and scores its victory points - either side can win it, and progress is never lost. How to make it work: hold the zone with a strict majority; interruptions only pause your count, and it resumes where it left off.
VictoryHex.describe.defend=What it does: this point belongs to its owner and only the enemy can take it, by draining a grip of {0} that never recovers; at zero it falls and the takers score its victory points. How to make it work: as the owner, keep the zone completely CLEAR - any enemy unit inside drains {1} per turn even while outnumbered; as the attacker, just keep something alive in the zone.
VictoryHex.describe.retained=Keep control when empty is on: once a side holds this point it stays theirs after their units leave, until the other side takes it. An empty point keeps scoring for its holder, but nobody makes progress toward securing or capturing it until a unit is standing there again.
VictoryHex.describe.scan.on_exit=What it does: a unit that scans this point records a reading; the owner scores the point's victory points once that unit leaves the battlefield over its home edge, no earlier than the turn set in Victory Conditions. How to make it work: give a unit a Scan order on this hex in the pre-End declarations phase from within scanning range and line of sight, pass the sensor check in the End Phase, keep the unit alive, then walk it off your home edge. Lose the unit and the reading is lost with it.
VictoryHex.describe.scan.on_scan=What it does: the owner scores this point's victory points the moment a unit scans it successfully, and keeps them whatever happens next. How to make it work: give a unit a Scan order on this hex in the pre-End declarations phase from within scanning range and line of sight, and pass the sensor check in the End Phase.
VictoryHex.describe.scan.on_scan_until_lost=What it does: the owner scores this point's victory points the moment a unit scans it successfully, but if that unit is destroyed or captured before it leaves the battlefield the points are taken back and the point is open again. How to make it work: scan it as above, then keep the scout alive or get it off the board; the defender's answer is to hunt the scout down.
VictoryHex.describe.capture=What it does: only the owner''s enemies can capture this point, by filling a progress meter to {0} - and progress is fully reversible. How to make it work: as the attacker, CONTROL the zone (strict majority) to add {1} per turn; as the owner, retake control to push it back by {1}. A contested tie freezes the meter.
VictoryHex.radius.tooltip=How far around the flag's hex the control zone reaches, in hexes. 0 means only the flag's own hex counts.
VictoryHex.victoryPoints.tooltip=The victory points this point is worth when it scores.
VictoryHex.counting.consecutive.tooltip=One unbroken run: losing the point - even to an uncontrolled turn - resets the count to zero.
VictoryHex.counting.cumulative.tooltip=Turns add up: losing the point only pauses the count, and it resumes where it left off.
VictoryHex.turnsToSecure.tooltip=How many turns a side must hold the point to secure it.
VictoryHex.startingGrip.tooltip=The grip the owner starts with. Each turn with an enemy in the zone drains it; at zero the point falls.
VictoryHex.pointsToCapture.tooltip=The capture progress an attacker must reach to take the point.
VictoryHex.gripDrainPerTurn.tooltip=How much grip is lost each turn an enemy unit is anywhere in the zone.
VictoryHex.progressPerTurn.tooltip=How much progress a controlling turn adds - and how much the owner's control pushes back.
